version: '3.8'

services:
  # Next.js приложение
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - KINESCOPE_API_KEY=${KINESCOPE_API_KEY}
      - BOT_TOKEN=${BOT_TOKEN}
      - NEXT_PUBLIC_BOT_USERNAME=${NEXT_PUBLIC_BOT_USERNAME}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - trenki-network
    depends_on:
      - bot

  # Telegram бот
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
      - APP_URL=${NEXT_PUBLIC_APP_URL}
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - trenki-network

networks:
  trenki-network:
    driver: bridge
