"Потенциал" и характеристики-метрики
СТАРТОВЫЙ РАСЧЕТ ХАРАКТЕРИСТИК
На странице личного кабинета все характеристики по «0» и серые или полупрозрачные, с островком «раскрой свой потенциал»! ➡️ пройдите опрос
(Узнаем примерные изначальные показатели пользователя) для каждого показателя свое значение.
Применяем ограничения
Изначально диапазон для каждой характеристики будет 20-75 очков. тк со старта нужна мотивация развиваться
rating = raw * k_mastery
rating_power = оценка сила * k_mastery
rating_speed = оценка скорость * k_mastery
rating_endurance = оценка выносливость *  k_mastery
rating_technique = оценка техника * k_mastery
rating_flexibility = оценка гибкость * k_mastery
——————
Оценить свои 5 характеристик (сила, скорость, выносливость, техника, гибкость) по 10-балльной шкале 1-10 (raw)
——————
Вопросы для выявления кф мастерства (k_mastery) [произведение кф четырех ответов] :
Сколько лет вы занимаетесь хоккеем? 
<1 года х1.53 к характеристикам
1-3 года х1.65
3-5 лет х1.7
>5 лет х1.75
——————
Как часто вы тренируетесь на льду и на земле (командные и доп тренировки)? [индикатор вовлеченности]
Раз в неделю или реже х1.53
2-4 раза в неделю х1.65
Почти каждый день х1.7
Несколько раз в день х1.75
——————
Как часто вы играете матчи?
[индикатор текущей практики]
Не играю, только тренируюсь х1.53
Несколько раз в месяц х1.65
Раз в неделю х1.7
Несколько (от 2) раз в неделю х1.75
——————
Оцените, насколько сложно вам даются игровые ситуации (единоборства, обводка, игра в пас и тд) против равных по возрасту и/или опыту соперников?
Очень сложно, я часто проигрываю х1.53
Есть сложности, но я могу конкурировать х1.64
В большинстве случаев я чувствую свое преимущество х1.75

k_mastery = min 5.5, max 9.4
5.5 -> каждая характеристика по 1.53
9.4 -> каждая характеристика 1.75

ПРИМЕР СТАС КИЧИГИН (2013 гр)
Самооценки (raw):
Скорость 6; сила 8; техника 10; выносливость 6; гибкость 8.
Опрос (k_mastery):
>5 лет в хоккее х1.75; тренировки несколько в день х1.75; играет несколько раз в неделю х1.75; есть сложности в игровых ситуациях х1.64.
k_mastery 8.78

Сила -> rating_power = 8*8.78 = 70.24 (отображаем до десятых -> 70.2)
Скорость -> rating_speed = 6*8.78 = 52.68
Выносливость -> rating_endurance = 6*8.78 = 52.68
Техника -> rating_technique = 10*8.78 = 87.8 -> 75 (тк лимит на старте)
Гибкость -> rating_flexibility = 8*8.78 = 70.24
Среднее арифметическое 64.168 = rating_avg = potential

СТАРТОВЫЙ РАСЧЕТ “ПОТЕНЦИАЛА”
potential = rating_avg
Начиная со старта
"потенциал" = среднее арифметическое всех показателей
Соответственно от тоже динамический и меняется после прохождения тренировки. (+ нужно добавить систему убывания всех показателей при пропуске тренировок. Можно оставить на потом, не критично)

ПРИМЕР СТАС КИЧИГИН
(rating_power 70.24 + rating_speed 52.68 + rating_endurance 52.68 + rating_technique 75 + rating_flexibility 70.24) / 5 = 64.1(68) potential

ПРОГРЕСС И ПОВЫШЕНИЕ ХАРАКТЕРИСТИК С ПРОХОЖДЕНИЕМ ТРЕНИРОВОК
Тип нагрузки и какую стату она повышает:
Скорость: + к скорости и выносливости
Мощность: + к силе и скорости
Сила: + к силе 
Выносливость: + к выносливости
Ловкость: + к технике
Мобильность: + гибкость и 0.5 техника
Растяжка: + гибкость и 0.5 техника
ЛФК + гибкость и 0.5 сила
Техника: + к технике (и +0.5 к стате с которой она идет, техника почти всегда будет + тип нагрузки)
+ в разминке подсчитываем 1 к гибкости и 0.5 к любому другому типу нагрузки

ФОРМУЛА
прирост = base_gain * ( (100 - current_value) / 100 )
base_gain - базовое значение прироста за один модуль для каждой затрагиваемой характеристики =0.5
current_value - текущий рейтинг отдельно взятой характеристики
Соответственно чем выше рейтинг отдельной физической характеристики - тем сложнее ее "прокачать"
ВАЖНО!
Одна тренировка состоит из нескольких модулей (разминка, ОФП/СФП, работа с клюшкой, заминка). Каждый из модулей может иметь до 2 тегов, особенно работа с клюшкой - там почти всегда это техника + скорость/сила/выносливость

ПРИМЕР СТАС КИЧИГИН
Прошел полную тренировку из 4 модулей:
1 Разминка - динамическая растяжка [+ 0.5 (гибкость и техника)]
2 ОФП/СФП - плиометрическая работа (мощность) [+сила и 0.5 скорость]
3 Работа с клюшкой - скоростной дриблинг [+техника и скорость]
4 Заминка - ЛФК коленный сустав [+гибкость и 0.5 сила]
Теги за тренировку: х1.5 сила, х1.5 скорость, х1.5 гибкость, х1.5 техника

*в скобках просто скрытые для пользователя данные тк отображаем только до десятых.
rating_power 70.24 -> прирост = 0.5 * ((100-70.4)/100) = 0.1488; х1.5 тк за тренировку х1.5 показателя "сила" = + 0.2232 -> 70.4(63)
rating_speed 52.68 -> +0.2366 х1.5 за тренировку = + 0.3549 -> 53.0(35)
rating_endurance 52.68 -> 52.68 (выносливости нет в тренировке)
rating_technique 75 -> +0.125 х1.5 за тренировку = +0.187 -> 75.1(87)
rating_flexibility 70.24 -> 0.1488 х1.5 = 0.2232 -> 70.4(63)
potential 64.1-> rating_avg (70.463+53.035+52.68+75.187+70.463) / 5 = 64.3656
Будут разнонаправленные тренировки с разной прокачкой характеристик. Например если бы мы заменили разминку «динамическая растяжка» на «разминочный кроссфит комплекс» то первый модуль у нас стал бы не 0.5 [гибкость и техника] а например 0.5 [сила и выносливость].
Если пользователь смотрит отдельно модуль, без нашего алгоритма-конструктора -> соответственно высчитывается прогресс за один этот модуль.
——————
БАЛАНСИРОВКА И ОГРАНИЧЕНИЯ
Лимит тренировок в день: Чтобы избежать фарма (быстрой прокачки множеством коротких тренировок), введите лимит — не более 2 тренировок в день, за которые начисляется прирост (или 4 отдельных модуля). Это также стимулирует качественное восстановление.
Восстановление: Можно ввести скрытую характеристику
 «Усталость», которая накапливается после тренировок и уменьшает эффективность прокачки до отдыха.
Квесты и достижения: Для ускорения прокачки на высоких уровнях введите бонусы за серии тренировок (стрики) или за достижение целей.

