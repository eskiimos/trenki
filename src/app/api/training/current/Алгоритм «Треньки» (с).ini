Алгоритм «Треньки» (с)
1 ПОСЛЕДОВАТЕЛЬНОСТЬ МОДУЛЕЙ
Каждая тренировка состоит из 4 модулей:
разминка ~10-15’ (разминочный комплекс или динамическая растяжка)
Физ подготовка ~20-25’ (ОФП/СФП)
Техника ~20-25’ (работа с клюшкой)
Заминка ~15-20’ (ЛФК или стречинг/растяжка)
2 ФИЗ ПОДГОТОВКА КАК СТЕРЖНЕВОЙ МОДУЛЬ
От нее зависят требованияк разминке, заминке, а так же технике.
Физ подготовка как база - остальные модули подбираем под нее. 
3 ТЕГИ МОДУЛЕЙ
Алгоритм использует теги каждого модуля, для построения тренировок:
Тип нагрузки (скорость, мощность, сила, выносливость, ловкость, мобильность, растяжка, ЛФК, техника)
Направление нагрузки (все тело, низ тела, верх тела тяга, верх тела жим, кор стабилизация, кор динамика, ЛФК плечо/колено/спина)
Сложность (новичок, любитель, продвинутый, про)
Целевая возрастная группа (ребенок, подросток, взрослый)
Состояние (восстановление, развитие, пик)
*4 МЕТРИКА НАГРУЗКИ
Каждому видео-модулю в метаданных присваиваем значение предполагаемый_RPE от 1 до 10 (предполагаемые усилия/энергозатраты) или мы будем по факту узнавать у пользователя (опрос)?
5 УЧЕТ СОСТОЯНИЯ (восстановление, развитие, пик)
Ввести в алгоритм простейший «тренировочный статус» пользователя:
1. Перед каждой тренировкой пользователь отвечает на «когда ты в последний раз полноценно тренировался?» (кф свежести):
-не тренировался больше недели = 1
-2-7 дней назад = 3
-вчера = 2
-сегодня уже тренировался = 1

2. Пользователь оценивает общее физ состояние (Energy) от 1 до 10 (где 1- еле ноги волочу, 10-готов горы свернуть)
Energy:
1 еле ноги волочу 
2 
3 я уставший
4 
5 средненько, немного уставший
6 
7 чувствую себя хорошо 👍🏻
8 
9 чувствую себя отлично
10 батарейка заряжена на 100%, готов горы свернуть


Алгоритм вычисляет Уровень_готовности = (Коэффициент_свежести + Energy) 
2-6 восстановление
7-10 развитие
11-13 пик

ЕСЛИ
Уровень_готовности 2-6: Статус = Восстановление.
Доступны только модули с тегами:
Разминка - динамическая растяжка
Физ подготовка - ЛФК, мобильность
Техника - техника (низка интенсивность)
Заминка - растяжка все тело/низ тела/верх тела
Уровень_готовности 7-10: Статус = Развитие
Доступны все развивающие модули:
Разминка - кроссфит комплекс, динамическая растяжка
Физ подготовка - выносливость, ловкость, скорость
Техника - + ловкость/скорость/выносливость/
Заминка -растяжка все тело/низ тела/верх тела, ЛФК плечо/колено/спина
 
Уровень_готовности 11-13: Статус = Пик
Доступны все модули с упором на высокую интенсивность:
Разминка - кроссфит комплекс
Физ подготовка - сила, скорость, выносливость, мощность
Техника - + мощность/выносливость/скорость/ловкость
Заминка - растяжка все тело/низ тела/верх тела, ЛФК плечо/колено/спина

*этап 2: для каждой возрастной группы свой уровень утомления
Дети >7 восстановление; 2-7 развитие; <2 пик;
Подростки >7 восстановление; 4-7 развитие; <4 пик;
Взрослые >6 восстановление: 3-6 развитие; <3 пик;

*После каждой тренировки пользователь оценивает сложность тренировки (RPE) от 1 до 10 (оставляем только для сбора данных и статистики)

**Обязательное условие - модули не должны повторяться подряд! В тренировке и следующей тренировке каждый модуль другой (разминка, физ подготовка, техника и заминка) - это разные видео-ролики, даже если оценка уровня утомления  остался без изменений - то могут быть с идентичным или близким наборов тегов, но разные видео (больше всего актуально для разминки и заминки).

6 ПРИНЦИП ЧЕРЕДОВАНИЯ «тяжелых» и легких дней
Если пользователь забивает на оценки в опросе - то подстраиваем программу под принцип чередования сложности тренировок.
Пример:
День 1  «тяжелый»: физ подготовка - сила, техника - мощность (высокий RPE [сколько?]) 
День 2 «легкий»: физ подготовка - мобильность, техника - ловкость (низкий RPE [сколько?])
День 3 «сложный»: физ подготовка - выносливость, техника скорость (высокий RPE)
День 4 «легкий»: физ подготовка - ЛФК, легкий уровень техники (низкий RPE)
7 СОВМЕСТИМОСТЬ ТИПА НАГРУЗКИ С НАПРАВЛЕНИЕМ НАГРУЗКИ
Физ подготовка:
Сила - все тело, низ тела, верх тела жим, верх тела тяга, кор стабилизация;
Скорость - низ тела, верх тела жим, кор динамика;
Выносливость - все тело, низ тела, верх тела жим, верх тела тяга, кор стабилизация, кор динамика;
Ловкость - все тело, низ тела
Мощность - все тело, низ тела, верх тела жим, верх тела тяга, кор динамика
Мобильность - ЛФК плечо, ЛФК колено, ЛФК спина
ЛФК - ЛФК плечо, ЛФК колено, ЛФК спина
Техника:
Скорость - все тело, верх тела
Выносливость - все тело, верх тела
Мощность - все тело, верх тела
Ловкость - все тело, верх тела
8 СОВМЕСТИМОСТЬ МОДУЛЯ «ТЕХНИКА» С МОДУЛЕМ «ФИЗ ПОДГОТОВКА»
Физ подготовка
Техника
Сила
Техника + мощность (взрывные элементы)/ловкость/выносливость
Скорость
Техника + ловкость/выносливость
Выносливость
Техника + скорость/ловкость/мощность
Мощность
Техника + скорость/ловкость
Ловкость
Техника + выносливость/скорость/мощность
Мобильность
Техника + ловкость новичок (для новичок и любитель) или любитель (для продивнутый или про)
ЛФК
Техника + новичок (для новичок и любитель) или любитель (для продивнутый или про) или еще один модуль ЛФК

+ЕСЛИ физ подготовка низ тела, то нельзя техника + все тело 
9 СОВМЕСТИМОСТЬ МОДУЛЯ «РАЗМИНКА» СО СТАТУСОМ уровня готовности
Готовность 2-6: Статус = Восстановление.
Разминка - динамическая растяжка
Готовность 7-10: Статус = Развитие
Разминка - кроссфит комплекс или динамическая растяжка;
При «физ подготовка» мощность, скорость, сила -> кроссфит
При «физ подготовка» выносливость, ловкость, мобильность, ЛФК -> дин растяжка
Готовность 11-13: Статус = Пик
Разминка - кроссфит комплекс
10 СОВМЕСТИМОСТЬ МОДУЛЯ «РАЗМИНКА» С МОДУЛЕМ «ФИЗ ПОДГОТОВКА»
Алгоритм отталкивается от направленности модуля «физ подготовка»:
Физ подготовка
Разминка
Все тело
Кроссфит комплекс или динамическая растяжка + все тело
Низ тела
Кроссфит комплекс/динамическая растяжка + все тело/низ тела
Верх тела жим
Кроссфит комплекс/динамическая растяжка + верх тела жим
Верх тела тяга
Кроссфит комплекс/динамическая растяжка + верх тела (тяга)
Кор стабилизация
Кроссфит комплекс или динамическая растяжка + все тело
Кор динамика
Кроссфит комплекс или динамическая растяжка + все тело
ЛФК колено
Динамическая растяжка + низ тела
ЛФК плечо/спина
Динамическая растяжка + все тело

+
Если тип нагрузки сила/мощность/скорость -> то разминка = кроссфит комплекс
Если тип нагрузки выносливость/ловкость /мобильность/ЛФК -> то разминка = динамическая растяжка

11 СОВМЕСТИМОСТЬ МОДУЛЯ «ЗАМИНКА» С МОДУЛЕМ «ФИЗ ПОДГОТОВКА»
Алгоритм отталкивается от направленности модуля «физ подготовка»:
Физ подготовка
Заминка
Все тело
Растяжка все тело, ЛФК спина
Низ тела
Растяжка низ тела/все тело, ЛФК колено
Верх тела жим
Растяжка верх тела жим, ЛФК плечо
Верх тела тяга
Растяжка все тело/верх тела тяга, ЛФК спина
Кор стабилизация
Растяжка все тело
Кор динамика
Растяжка все тело
ЛФК колено
Растяжка низ тела/все тело
ЛФК плечо/спина
Растяжка все тело, верх тела жим/тяга

