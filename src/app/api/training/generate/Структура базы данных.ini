Структура базы данных
Таблица пользователи (users)
User_id (PK) - уникальный ID пользователя/специалиста (для рефералки?)
Age (INT) - возраст (прогрессивное значение)
Potential (INT) - рассчитанный потенциал (прогрессивное значение)
Training_goal (ENUM) - цель: развитие, восстановление, пик [development, recovery, peak]
Injury_risk (JSON) - риски травм (плечо, колено, голеностоп, спина)
Injury - текущие или восстановленные трамвы

Таблица тренировочные модули (training_modules)
Module_id (PK) - уникальный ID тренировки
Title (VARCHAR) - название видел
Duration (INT) - длительность в минутах
Video_url (VARCHAR) - ссылка на видео
Module_type (ENUM) - тип блока: разминка, физ подготовка (ОФП/СФП), техника (работа с клюшкой), заминка (растяжка/стречинг/ЛФК) [warmup, physical, technical, cooldown]
Age_group (ENUM) - целевая возрастная группа [kids, teens, adults]
RPE (INT) - предполагаемые усилия/энергозатраты (1-10)
Equipment (JSON) - необходимый инвентарь

Таблица связь модулей и тегов (module_tags) - сердце системы
Id (PK) - уникальный ID
Module_id (FK) - ссылка на модуль
Tag_type (VARCHAR) - категория тега
Tag_value (VARCHAR) - значение тега


СИСТЕМА ТЕГОВ (module_tags)
Тип нагрузки (tag_type: ‘load’)
Скорость - 30-45" интервальной работы
Мощность (взрывная сила) - взрывные упражнения с плиометрикой
Сила (максимальная сила) -статическая/изометрическая нагрузка, пиковое проявление силы
Выносливость: силовая, анаэробная, аэробная
Ловкость (координация, баланс-равновесие)
Мобильность (вращательные функции суставов и мышц) 
Растяжка: статическая и динамическая
ЛФК (восстановление и предотвращение трамв)
Техника (технические элементы)
* speed, power, max_strength, strength_endurance, anaerobic_endurance, aerobic_endurance, agility, mobility, static/dynamic_stretch, prehab, technical_skill

Направление нагрузки (tag_type: ‘muscle’)
Низ тела: ноги, ягодицы, колени, голеностоп
Верх тела тяга: спина, бицепс, задние дельты
Верх тела жим: грудь, трицепс, передние/средние дельты
Кор стабилизация: статическая работа кора
Кор динамика: динамическая работа кора, ротационные движения
ЛФК плечо: ротаторы плеча, профилактика, растяжка и мобильность плечевого сустава
ЛФК колено: профилактика травм коленей, укрепление связок
ЛФК спина: профилактика болей в спине, стречинг
Все тело: упражнения, комплексно нагружающие организм
* lower_body, upper_pull, upper_push, core_stability, core_dynamics, prehab_ shoulder, prehab_knee, prehab_back, full_body


Сложность (tag_type: 'complexity')
Новичок
Любитель
Продвинутый
Про
*beginner, amateur, advanced, pro
Привязывается к «потенциалу» пользователя (и меняется в зависимости от перехода на другой "уровень")

Цель (tag_type: ‘goal’) или состояние (tag_type: ‘status’)
Восстановление
Развитие
Пик
* recovery, developmental, peak

Этап 1:
Для простоты в начале прикрутим под сезонность хоккея:
Ноябрь - развитие
Декабрь - пик, числа с 20 восстановление
Январь - восстановление, числа с 15 развитие
Февраль - развитие
Март - развитие
Апрель - развитие + пик
Май - развитие + пик, числа с 15 восстановление
Июнь - восстановление, числа с 15 развитие
Июль - развитие, числа с 25 пик
Август - пик, числа с 15 развитие

Этап 2: Взаимодействие с календарем игр и турниров спортсмена

Этап 3: Интеграция датчиков (умные часы, пульсометр)
+ обязательно прикрутить «оценку нагрузки» - кнопка "Это было легко/тяжело", которая будет незначительно повышать/понижать рейтинг модуля для этого пользователя

