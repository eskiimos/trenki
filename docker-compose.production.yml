services:
  # Одноразовый сервис: применяет ожидающие миграции БД ПЕРЕД стартом app.
  # Берём стейдж deps — там есть prisma CLI + schema + migrations. Идемпотентно
  # (no-op, если применять нечего). app ждёт его успешного завершения ниже.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: trenki-migrate
    command: npx prisma migrate deploy
    environment:
      - DATABASE_URL=${DATABASE_URL}
    restart: "no"
    networks:
      - trenki-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        - NEXT_PUBLIC_BOT_USERNAME=${NEXT_PUBLIC_BOT_USERNAME}
    container_name: trenki-app
    # app стартует только после успешного применения миграций.
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=production
      # Граница календарного дня (стрик/темп/лига) — Москва, не UTC: без TZ
      # контейнер живёт в UTC и «день» переключается в 03:00 МСК (стрик
      # сбрасывался при ночных тренировках). Основная math уже ходит по
      # User.timezone, TZ — страховка для остатков серверной «полуночи».
      - TZ=Europe/Moscow
      - DATABASE_URL=${DATABASE_URL}
      # JWT-сессии. >=32 символа. openssl rand -base64 48.
      - SESSION_SECRET=${SESSION_SECRET}
      # Админ-панель (логин+пароль) и cron-секрет.
      - ADMIN_LOGIN=${ADMIN_LOGIN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CRON_SECRET=${CRON_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Legacy / уже не используем, но переменные могут быть в .env — оставим
      # на случай, если что-то ещё на них смотрит.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - BOT_TOKEN=${BOT_TOKEN}
      - WEB_APP_URL=${WEB_APP_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      # Собственное S3-хранилище видео (reg.ru cloud storage). Ключи давно
      # лежали в .env.production, но сюда проброшены не были — приложение
      # работало вообще без S3: админ-загрузка и s3://-видео падали бы.
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - NEXT_PUBLIC_KINESCOPE_API_KEY=${NEXT_PUBLIC_KINESCOPE_API_KEY}
      - KINESCOPE_API_KEY=${NEXT_PUBLIC_KINESCOPE_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      # Demo-bypass для одного фиксированного email (без OTP). НЕ задавать
      # для prod-юзеров — только служебный demo/QA аккаунт.
      - DEMO_BYPASS_EMAIL=${DEMO_BYPASS_EMAIL}
      - DEMO_BYPASS_CODE=${DEMO_BYPASS_CODE}
      # Auto-deploy: GitHub webhook → POST /api/webhook/github-deploy
      # пишет триггер-файл в /tmp/deploy-trigger (см. volumes ниже).
      # Host-cron подбирает файл и запускает /home/trenki/deploy.sh.
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      # T-Bank интернет-эквайринг (Трек B). Секреты — только в .env.production.
      # Пусто → оплата недоступна (getTbankConfig()=null), приложение работает.
      - TBANK_TERMINAL_KEY=${TBANK_TERMINAL_KEY:-}
      - TBANK_PASSWORD=${TBANK_PASSWORD:-}
      - TBANK_API_BASE=${TBANK_API_BASE:-}
      - TBANK_RETURN_ORIGIN=${TBANK_RETURN_ORIGIN:-https://trenki.app}
    volumes:
      # Shared dir с хостом для auto-deploy trigger'а. На хосте должна
      # существовать ./deploy-trigger; host-cron поллит её.
      - ./deploy-trigger:/tmp/deploy-trigger
    ports:
      - "3000:3000"
    restart: always
    networks:
      - trenki-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # В standalone-образе нет curl/wget — пингуем через встроенный Node.
      # /api/health: 200 если все required env заданы И БД отвечает на SELECT 1,
      # иначе 503. Раньше тыкали /login (всегда 200) — упавшая БД не палилась.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:latest
    container_name: trenki-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - trenki-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  trenki-network:
    driver: bridge

volumes:
  postgres_data:
