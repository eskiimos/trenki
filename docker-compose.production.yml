version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        - NEXT_PUBLIC_BOT_USERNAME=${NEXT_PUBLIC_BOT_USERNAME}
    container_name: trenki-app
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      # JWT-сессии. >=32 символа. openssl rand -base64 48.
      - SESSION_SECRET=${SESSION_SECRET}
      # Админ-панель (логин+пароль) и cron-секрет.
      - ADMIN_LOGIN=${ADMIN_LOGIN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CRON_SECRET=${CRON_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Legacy / уже не используем, но переменные могут быть в .env — оставим
      # на случай, если что-то ещё на них смотрит.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - BOT_TOKEN=${BOT_TOKEN}
      - WEB_APP_URL=${WEB_APP_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - NEXT_PUBLIC_KINESCOPE_API_KEY=${NEXT_PUBLIC_KINESCOPE_API_KEY}
      - KINESCOPE_API_KEY=${NEXT_PUBLIC_KINESCOPE_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      # Demo-bypass для одного фиксированного email (без OTP). НЕ задавать
      # для prod-юзеров — только служебный demo/QA аккаунт.
      - DEMO_BYPASS_EMAIL=${DEMO_BYPASS_EMAIL}
      - DEMO_BYPASS_CODE=${DEMO_BYPASS_CODE}
    ports:
      - "3000:3000"
    restart: always
    networks:
      - trenki-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # В standalone-образе нет curl/wget — пингуем через встроенный Node.
      # /api/health: 200 если все required env заданы И БД отвечает на SELECT 1,
      # иначе 503. Раньше тыкали /login (всегда 200) — упавшая БД не палилась.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:latest
    container_name: trenki-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - trenki-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  trenki-network:
    driver: bridge

volumes:
  postgres_data:
